name: Deploy OpsTrack to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality:
    name: Contrôles préalables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, mysql, mongodb, redis
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Lint PHP
        run: find app config routes -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: PHPUnit
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan test || true

  deploy:
    name: Déploiement production
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ajout de l'hôte aux known_hosts
        run: ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Exécution du script de déploiement
        run: |
          ssh ubuntu@${{ secrets.PROD_HOST }} 'bash /var/www/opstrack/scripts/deploy.sh main'

      - name: Smoke test
        run: |
          sleep 5
          code=$(curl -sk -o /dev/null -w "%{http_code}" https://${{ secrets.PROD_HOST }}/api/health)
          test "$code" = "200" || { echo "Smoke test échoué : $code"; exit 1; }
          echo "Smoke test OK ($code)"

      - name: Rollback si échec
        if: failure()
        run: |
          ssh ubuntu@${{ secrets.PROD_HOST }} 'bash /var/www/opstrack/scripts/rollback.sh'